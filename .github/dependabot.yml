# Weekly update pull requests for the CI tools (pip) and the SHA-pinned GitHub Actions. Minor and
# patch bumps arrive as one grouped PR per ecosystem (efficiency.md, rule 4); majors stay separate.
version: 2
updates:
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
