# Gitleaks configuration: the default rules, plus one allowlist for the secret and sensitive-data
# scanners' unit tests, whose fixtures are fake keys and numbers made to look real on purpose.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures of the bundled scanners (fake values by design)"
# Only the two test files whose fixtures are fake secrets and fake card numbers; any other file,
# including the other scanners' tests, is scanned as normal.
paths = [
  '''^secret-history-scan/scripts/test_scan_history\.py$''',
  '''^compliance-check/scripts/test_scan_sensitive\.py$''',
]
